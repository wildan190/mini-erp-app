[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------
; Octane / Swoole — HTTP server for core-service
;
; Core-service handles: auth, platform dashboard, landing page,
; Swagger docs, Horizon UI, Telescope UI.
; Traffic is lighter than domain services, so 2 workers is plenty.
; ---------------------------------------------------------------
[program:octane]
process_name=%(program_name)s
command=php /app/artisan octane:start
    --server=swoole
    --host=0.0.0.0
    --port=8000
    --workers=%(ENV_OCTANE_WORKERS)s
    --task-workers=%(ENV_OCTANE_TASK_WORKERS)s
    --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
directory=/app
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/octane.log
stderr_logfile=/var/log/supervisor/octane_err.log
stopwaitsecs=3600

; ---------------------------------------------------------------
; Horizon — queue worker, runs only on core-service.
; All domain services share the same Redis queue but only
; core-service runs the Horizon supervisor to process jobs.
; ---------------------------------------------------------------
[program:horizon]
process_name=%(program_name)s
command=php /app/artisan horizon
directory=/app
autostart=true
autorestart=true
user=root
stopwaitsecs=3600
stdout_logfile=/var/log/supervisor/horizon.log
stderr_logfile=/var/log/supervisor/horizon_err.log
