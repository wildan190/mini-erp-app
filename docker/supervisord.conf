[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------
; Octane / Swoole
;
; --workers          : number of HTTP worker processes
;                      Defaults to OCTANE_WORKERS env var (set in .env.docker).
;                      2 workers handle concurrent requests well for a
;                      single-node dev/staging setup while keeping RAM low.
;
; --task-workers     : number of task dispatcher processes (used by
;                      Octane::concurrently / dispatchViaSwoole).
;                      1 is fine for most queue-offload tasks.
;
; --max-requests     : recycle a worker after N requests to prevent
;                      memory creep from long-lived processes.
; ---------------------------------------------------------------
[program:octane]
process_name=%(program_name)s
command=php /app/artisan octane:start
    --server=swoole
    --host=0.0.0.0
    --port=8000
    --workers=%(ENV_OCTANE_WORKERS)s
    --task-workers=%(ENV_OCTANE_TASK_WORKERS)s
    --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
directory=/app
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/octane.log
stderr_logfile=/var/log/supervisor/octane_err.log
stopwaitsecs=3600
