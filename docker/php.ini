; ============================================================
; Mini-ERP PHP Runtime Configuration
; Tuned for Swoole/Octane long-lived workers — low RAM footprint
; ============================================================

[PHP]
; Each Swoole worker loads the full Laravel app once and keeps it in memory.
; 128M per request max is plenty; the worker itself will use ~45-50MB base.
memory_limit = 128M

; Disable unused output buffering overhead
output_buffering = Off

; Shorter default timeouts — Octane manages its own execution time
max_execution_time = 30
max_input_time = 30

; Limit upload/post sizes — adjust if file uploads are needed
post_max_size = 20M
upload_max_filesize = 20M

; ============================================================
; OPcache — share compiled bytecode across all workers via SHM
; ============================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; Shared memory for compiled scripts — 64MB is plenty for a Laravel app.
; All Swoole workers in the same process share this via mmap, so this is
; a fixed one-time cost regardless of worker count.
opcache.memory_consumption = 64

; Interned strings buffer — reduces per-worker string duplication
opcache.interned_strings_buffer = 16

; Max number of cached script files — 4000 covers vendor + app
opcache.max_accelerated_files = 4000

; validate_timestamps = 1 so that file changes on the mounted volume
; are picked up on the next request cycle (1-second revalidation window).
; Setting this to 0 caused stale bytecode to survive container restarts.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

; Aggressive optimization level
opcache.optimization_level = 0x7FFEBFFF

; JIT — disabled for stability under Swoole coroutines
opcache.jit = disable
opcache.jit_buffer_size = 0

; ============================================================
; Realpath cache — fewer stat() syscalls per request
; ============================================================
; 512K cache covers the full vendor + app file tree
realpath_cache_size = 512K
; 10 min TTL — files don't change in a container without restart
realpath_cache_ttl = 600

; ============================================================
; GC & misc
; ============================================================
; Cycle GC — PHP's circular reference collector.
; Keep it active. Swoole workers are long-lived so circular refs
; accumulate fast. Lower gc_divisor = GC fires more frequently.
zend.enable_gc = 1

; Fire the circular-reference collector after every ~500 allocations
; (default gc_divisor=100 means 1 in 100 chance per allocation cycle,
;  which is too infrequent for high-throughput workers)
gc_divisor = 100
gc_probability = 1

; Sessions are not used in this API, so avoid session file GC overhead
session.gc_probability = 0

gc_maxlifetime = 1440

; Disable unused extensions from loading at runtime
; (already not installed, but just being explicit)
; extension=xdebug  ; never in production
