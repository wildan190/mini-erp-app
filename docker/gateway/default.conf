server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # ------------------------------------------------------------------
    # Routing map
    #
    #   auth-service  → POST /api/platform/login
    #                   POST /api/platform/register
    #                   POST /api/platform/logout
    #
    #   core-service  → GET  /api/platform/dashboard
    #                   GET  /                (landing page)
    #                   GET  /api/documentation  (Swagger)
    #                   GET  /telescope
    #                   GET  /horizon
    #                   GET  /up             (health check)
    #                   everything else not matched below
    #
    #   hrm-service        → /api/platform/hrm/*
    #   crm-service        → /api/platform/crm/*
    #   finance-service    → /api/platform/finance/*
    #   purchasing-service → /api/platform/purchasing/*
    #   project-service    → /api/platform/project/*
    # ------------------------------------------------------------------

    # ── Auth Service (exact match) ─────────────────────────────────────
    location = /api/platform/login {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location = /api/platform/register {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location = /api/platform/logout {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ── Core Service (exact match for dashboard) ───────────────────────
    location = /api/platform/dashboard {
        proxy_pass http://core-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ── Domain Services (prefix match) ────────────────────────────────
    location /api/platform/hrm {
        proxy_pass http://hrm-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/crm {
        proxy_pass http://crm-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/finance {
        proxy_pass http://finance-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/purchasing {
        proxy_pass http://purchasing-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/project {
        proxy_pass http://project-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/inventory {
        proxy_pass http://inventory-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /api/platform/system {
        proxy_pass http://system-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ── Core Service catch-all ─────────────────────────────────────────
    # Landing page, /horizon UI, /telescope UI, /api/documentation,
    # /up health check — all served by core-service.
    location / {
        proxy_pass http://core-service:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
